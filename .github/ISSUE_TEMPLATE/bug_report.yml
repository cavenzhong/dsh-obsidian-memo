name: Bug 报告
description: 使用中遇到异常、报错或行为不符合预期
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量补全环境信息和复现步骤；涉及隐私的绝对路径、笔记内容可以打码或替换。
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本
      description: 在 DSH 的关于/设置里查看；例如 0.2.2-rc.1。
      placeholder: "0.2.2-rc.1"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 面板标题旁会显示版本号；旧包名为 dsh-sticky-notes。
      placeholder: "0.14.2"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - DSH 桌面版 · macOS
        - DSH 桌面版 · Windows
        - DSH 桌面版 · Linux
        - DSH Web GUI（浏览器）
        - 其他
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 操作系统版本
      placeholder: "macOS 15.1 / Windows 11 23H2 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本（可选）
      description: 只在「在 Obsidian 打开」、模板、附件或 vault 路径相关问题时需要。
      placeholder: "1.7.x"
  - type: input
    id: vault-state
    attributes:
      label: 仓库状态（可选）
      description: 例如本地磁盘 / iCloud / 网络盘；便签数量；是否开启子文件夹和日期筛选。
      placeholder: "iCloud，约 100 篇，包含子文件夹，日期筛选默认开启"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开面板开始，按顺序写清每一步。
      placeholder: |
        1. 打开便签面板
        2. 输入标题「...」，附上两张图片
        3. 点击 ...
        4. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包括报错文案、toast 提示、控制台日志或截图。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 是否同时开着 Obsidian、是否使用 Default Template、是否配置了归档/开档目录、是否安装过旧包名版本等。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，未发现相同问题
          required: true
        - label: 已尝试停用再启用插件或重启 DSH
          required: false
