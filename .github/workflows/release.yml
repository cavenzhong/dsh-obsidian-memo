name: Publish release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.16.2 (leave empty for main)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate version and prepare release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:\.\d+)?(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid release version');
          const tag = `v${version}`;
          const expected = process.env.REQUESTED_TAG || (process.env.RELEASE_REF.startsWith('refs/tags/') ? process.env.RELEASE_REF.slice(10) : tag);
          if (expected !== tag) throw new Error(`Tag ${expected} does not match package version ${version}`);
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const result = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(tag)}`, {
            headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
          });
          if (result.status === 200) {
            const existing = await result.json();
            if (existing.draft) throw new Error(`Release ${tag} is a draft; finish or remove it before retrying`);
            console.log(`Release ${tag} already exists; skipping`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'skip=true\n');
          } else {
            if (result.status !== 404) throw new Error(`Unable to check release: HTTP ${result.status}`);
            const refs = execFileSync('git', ['tag', '--list', tag], { encoding: 'utf8' }).trim();
            if (refs && execFileSync('git', ['rev-parse', `${tag}^{}`], { encoding: 'utf8' }).trim() !== sha) throw new Error(`Tag ${tag} points to a different commit`);
            const lines = readFileSync('docs/CHANGELOG.md', 'utf8').split(/\r?\n/);
            const heading = lines.findIndex(line => line.startsWith(`## 版本 ${version} `));
            if (heading < 0) throw new Error(`Missing changelog entry for ${version}`);
            let end = lines.findIndex((line, index) => index > heading && /^## /.test(line));
            if (end < 0) end = lines.length;
            const notes = lines.slice(heading + 1, end).join('\n').trim().replace(/\]\(([^):#]+\.md)\)/g, (_, path) => '](' + process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/blob/' + tag + '/docs/' + path + ')');
            if (!notes) throw new Error(`Empty changelog entry for ${version}`);
            writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, notes + '\n');
            appendFileSync(process.env.GITHUB_OUTPUT, `skip=false\ntag=${tag}\nsha=${sha}\n`);
          }
          NODE

      - name: Install build dependencies
        if: steps.release.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.release.outputs.skip != 'true'
        run: pnpm test

      - name: Pack plugin
        if: steps.release.outputs.skip != 'true'
        run: pnpm pack --pack-destination "$RUNNER_TEMP/release-package"

      - name: Publish GitHub Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release-package/*.tgz \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
